[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Robot373"
version = "0.0.43"
description = "Robot373 - A wrapper around robot functions for the AI and Robotics SCI373 course"
authors = [
    {name = "Brian Blais"}
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyzmq",
]

# Standard script entry point mapping: executable_name = "module:function"
[project.scripts]
run_zmq_server = "Robot373.scripts.run_zmq_server:main"

[project.optional-dependencies]
pi = ["brickpi3"]

[project.urls]
Homepage = "https://github.com/bblais/Robot373"
Repository = "https://github.com/bblais/Robot373"

[tool.setuptools.packages.find]
where = ["."]
include = ["Robot373*"]