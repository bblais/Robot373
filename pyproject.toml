[project]
name = "Robot373"
version = "0.0.35"
description = "Robot373 - A wrapper around robot functions for the AI and Robotics SCI373 course"
authors = [
    {name = "Brian Blais"}
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyzmq",
]

[project.optional-dependencies]
pi = ["brickpi3"]

[project.urls]
Homepage = "https://github.com/bblais/Robot373"
Repository = "https://github.com/bblais/Robot373"
