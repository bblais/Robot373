[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "Robot373"
version = "0.0.42"
description = "Robot373 - A wrapper around robot functions for the AI and Robotics SCI373 course"
authors = [
    {name = "Brian Blais"}
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyzmq",
]

[project.optional-dependencies]
pi = ["brickpi3"]

[project.urls]
Homepage = "https://github.com/bblais/Robot373"
Repository = "https://github.com/bblais/Robot373"

[tool.setuptools.packages.find]
where = ["."]
include = ["Robot373*"]

# Specify standalone script files to copy to the system bin directory
[tool.setuptools.script-files]
script-files = [
    "Scripts/run_zmq_server.py"
]